[project]
name = "poslovi-mcp"
version = "0.1.0"
description = "MCP server + CLI for searching Serbian job boards (Infostud, HelloWorld.rs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
poslovi = "poslovi_mcp.cli:main"
poslovi-mcp = "poslovi_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poslovi_mcp"]
